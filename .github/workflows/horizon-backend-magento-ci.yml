# Reusable CI workflow for Hypernode Magento 2 backend projects.
#
# Call from a backend repo:
#
#   jobs:
#     ci:
#       uses: happy-horizon/actions/.github/workflows/horizon-backend-magento-ci.yml@production
#       with:
#         php_version: '8.2'
#         composer_version: '2.2'   # Magento ≤2.4.3 needs Composer 2.2 LTS
#         scan_path: app/code
#       secrets: inherit

name: Reusable Magento CI

on:
  workflow_call:
    inputs:
      php_version:
        type: string
        default: '8.2'
        description: PHP version to use for the CI jobs
      composer_version:
        type: string
        default: '2'
        description: >
          Composer version for shivammathur/setup-php tools (e.g. 2, 2.2).
          Use 2.2 for Magento ≤2.4.3 (laminas-dependency-plugin needs composer-plugin-api <2.3).
      php_extensions:
        type: string
        default: mbstring, xml, curl, zip, gd, intl, bcmath, soap, pdo_mysql, xsl, sockets
        description: PHP extensions to install
      scan_path:
        type: string
        default: app/code
        description: Path passed to the static scan script (relative to repo root)
      run_di_compile:
        type: boolean
        default: true
        description: >
          Run setup:di:compile with a throwaway env.php (no DB) to catch DI fatals
          before Hypernode build.
    secrets:
      SSH_PRIVATE_KEY:
        required: false
        description: Same key as Hypernode deploys; needed to clone private Git Composer repos (e.g. gitlab.hyva.io)
      DEPLOY_COMPOSER_AUTH:
        required: false

jobs:
  static-code-scans:
    name: Static Code Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          coverage: none
          tools: composer:${{ inputs.composer_version }}

      - name: Setup SSH for private Composer Git repos
        uses: happy-horizon/actions/.github/actions/setup-composer-ssh@production
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.DEPLOY_COMPOSER_AUTH }}
          # Magento 2.4.3 / PHP 7.4: Composer refuses tar/phar metadata without this.
          COMPOSER_ALLOW_UNSAFE_PHAR_METADATA: '1'

      - name: Run static code scans
        env:
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          set -euo pipefail
          # phpmd 3.x replaced the positional CLI (`phpmd PATH text RULESET`) with
          # Symfony Console (`phpmd analyze PATH --ruleset RULESET`). The Experius
          # testsuite static/run.sh still uses the phpmd 2 syntax. Detect and branch.
          # SCAN_PATH may hold multiple space-separated paths (e.g. "app/code/Vendor app/design"),
          # matching how Bitbucket passed them to static/run.sh as separate args. Expand it
          # unquoted everywhere: quoting glues the list into one nonexistent path and phpmd/phpcs
          # bail out with a usage error.
          if ./vendor/bin/phpmd list 2>/dev/null | grep -q 'analyze'; then
            echo "phpmd 3.x detected — scanning: ${SCAN_PATH}"
            # Same invocation as Bitbucket pipelines that already moved to phpmd 3.
            # shellcheck disable=SC2086
            ./vendor/bin/phpmd analyze ${SCAN_PATH} --ruleset unusedcode
            echo "scan PSR2 ${SCAN_PATH} severity 6"
            # shellcheck disable=SC2086
            ./vendor/bin/phpcs --standard=PSR2 ${SCAN_PATH} --severity=6
            echo "scan Magento2 ${SCAN_PATH} severity 10"
            # shellcheck disable=SC2086
            ./vendor/bin/phpcs ${SCAN_PATH} --standard=Magento2 --severity=10 --extensions=php
          else
            # shellcheck disable=SC2086
            bash ./vendor/experius/module-testsuite/Test/static/run.sh ${SCAN_PATH}
          fi

  # Catches Symfony Command::execute(): int incompatibilities (and other DI fatals)
  # before Hypernode build runs magento:compile. Requires a throwaway env.php; no DB needed.
  di-compile:
    name: Magento DI compile
    if: ${{ inputs.run_di_compile }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          coverage: none
          ini-values: memory_limit=2G
          tools: composer:${{ inputs.composer_version }}

      - name: Setup SSH for private Composer Git repos
        uses: happy-horizon/actions/.github/actions/setup-composer-ssh@production
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-di-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-di-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.DEPLOY_COMPOSER_AUTH }}
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
          # Magento 2.4.3 / PHP 7.4: Composer refuses tar/phar metadata without this.
          COMPOSER_ALLOW_UNSAFE_PHAR_METADATA: '1'

      # No 'db' section on purpose. Modules that touch the database during compile
      # (e.g. Amasty ExportCore's GenerateFactories plugin on the proxy generator)
      # guard on "is a default connection configured?" and skip themselves when it
      # is absent. Stubbing a fake db host instead makes them believe a database is
      # reachable, and compile dies on SQLSTATE[HY000] [2002] Connection refused.
      # This mirrors the Hypernode build container, which also compiles without a DB.
      - name: Create minimal env.php for compile
        run: |
          cat > app/etc/env.php <<'PHP'
          <?php
          return [
              'backend' => ['frontName' => 'admin'],
              'crypt' => ['key' => '00000000000000000000000000000000'],
              'x-frame-options' => 'SAMEORIGIN',
              'MAGE_MODE' => 'production',
              'session' => ['save' => 'files'],
              'cache' => [
                  'frontend' => [
                      'default' => ['id_prefix' => 'ci_'],
                      'page_cache' => ['id_prefix' => 'ci_'],
                  ],
              ],
              'cache_types' => [
                  'config' => 1,
                  'layout' => 1,
                  'block_html' => 1,
                  'collections' => 1,
                  'reflection' => 1,
                  'db_ddl' => 1,
                  'compiled_config' => 1,
                  'eav' => 1,
                  'customer_notification' => 1,
                  'config_integration' => 1,
                  'config_integration_api' => 1,
                  'full_page' => 1,
                  'config_webservice' => 1,
                  'translate' => 1,
              ],
              'install' => ['date' => 'Thu, 01 Jan 1970 00:00:00 +0000'],
          ];
          PHP

      - name: Run setup:di:compile
        run: |
          set -uo pipefail
          # Compile does not need a live DB, but Magento still exits non-zero afterward
          # (shutdown/cache hits the undefined "default" connection). Pass on the
          # success marker instead of the exit code, and fail hard when that marker is
          # missing (e.g. PHP fatals under Symfony 7).
          MAGE_MODE=production php -d memory_limit=2G bin/magento setup:di:compile 2>&1 | tee di-compile.log || true
          set -e
          grep -q 'Generated code and dependency injection configuration successfully' di-compile.log
          test -d generated/code
          test -d generated/metadata
