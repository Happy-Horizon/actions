name: Vercel Deploy Action
on:
  workflow_call:
jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      resolved_env: ${{ steps.resolve.outputs.resolved_env }}
    steps:
      - name: Resolve deployment environment
        id: resolve
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.git.ref }}
          PAYLOAD_ENV: ${{ github.event.client_payload.environment || github.event.client_payload.target || '' }}
        run: |
          case "${PAYLOAD_REF}" in
            production|refs/heads/production) resolved_env="production" ;;
            staging|refs/heads/staging) resolved_env="staging" ;;
            upgrade|refs/heads/upgrade) resolved_env="upgrade" ;;
            *) resolved_env="${PAYLOAD_ENV:-preview}" ;;
          esac
          echo "resolved_env=${resolved_env}" >> "$GITHUB_OUTPUT"

  promote:
    runs-on: ubuntu-latest
    needs: resolve-context
    if: ${{ needs.resolve-context.outputs.resolved_env == 'production' }}
    environment: production
    steps:
      - name: Promote to Production
        run: npm install -g vercel && vercel promote $VERCEL_DEPLOYMENT_URL --yes --token=$VERCEL_TOKEN --scope=experius
        env:
          VERCEL_DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  generate-csp-headers:
    runs-on: ubuntu-latest
    needs: [resolve-context, promote]
    if: ${{ always() && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && contains(fromJson('["staging","upgrade"]'), needs.resolve-context.outputs.resolved_env))) }}
    steps:
      - name: Generate CSP Headers
        run: |
          npm install -g vercel
          vercel env pull .env.vercel --yes --environment=${VERCEL_ENV} --token=$VERCEL_TOKEN || vercel env pull .env.vercel --yes --environment=preview --token=$VERCEL_TOKEN
          source .env.vercel
          url="https://trigger.happyhorizon.dev/csp_manage_fastly_header?FASTLY_SERVICE_ID=${FASTLY_SERVICE_ID}&FASTLY_API_KEY=${FASTLY_API_KEY}&SANSEC_ID=${SANSEC_ID}&CSP_STRICT=${CSP_STRICT}"
          response=$(curl -sw "%{http_code}" $url)
          status_code="${response:${#response}-3}"
          body=""
          if [ ${#response} -gt 3 ]; then body="${response:0:${#response}-3}"; else body=""; fi
          if [[ "$status_code" -ne 200 ]]; then echo "$body"; pkill LT; fi
        env:
          VERCEL_ENV: ${{ needs.resolve-context.outputs.resolved_env }}
          VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  full-purge-fastly:
    runs-on: ubuntu-latest
    needs: [resolve-context, promote, generate-csp-headers]
    if: ${{ always() && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && contains(fromJson('["production","staging","upgrade"]'), needs.resolve-context.outputs.resolved_env))) }}
    steps:
      - name: Full Purge Fastly
        run: |
          npm install -g vercel
          vercel env pull .env.vercel --yes --environment=${VERCEL_ENV} --token=$VERCEL_TOKEN || vercel env pull .env.vercel --yes --environment=preview --token=$VERCEL_TOKEN
          source .env.vercel
          url="https://trigger.happyhorizon.dev/fastly-flush-cache?FASTLY_SERVICE_ID=${FASTLY_SERVICE_ID}&FASTLY_API_KEY=${FASTLY_API_KEY}"
          response=$(curl -sw "%{http_code}" $url)
          status_code="${response:${#response}-3}"
          body=""
          if [ ${#response} -gt 3 ]; then body="${response:0:${#response}-3}"; else body=""; fi
          if [[ "$status_code" -ne 200 ]]; then echo "$body"; pkill LT; fi
        env:
          VERCEL_ENV: ${{ needs.resolve-context.outputs.resolved_env }}
          VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  newrelic:
    runs-on: ubuntu-latest
    name: New Relic
    if: ${{ needs.resolve-context.outputs.resolved_env == 'production' }}
    needs: [resolve-context, full-purge-fastly]
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d %H:%M')"
      - name: New Relic Application Deployment Marker
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: "US"
          guid: ${{ vars.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          user: "${{ github.actor }}"
          version: "${{ steps.date.outputs.date }}"
