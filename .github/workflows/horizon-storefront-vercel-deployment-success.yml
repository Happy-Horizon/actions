name: Vercel Deploy Action
on:
  workflow_call:
env:
  VERCEL_VERSION: "53"
jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      vercel_env: ${{ steps.resolve.outputs.vercel_env }}
      gate_env: ${{ steps.resolve.outputs.gate_env }}
      csp_eligible: ${{ steps.resolve.outputs.csp_eligible }}
    steps:
      - name: Resolve deployment environment
        id: resolve
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.git.ref }}
          PAYLOAD_ENV: ${{ github.event.client_payload.environment || github.event.client_payload.target || '' }}
        run: |
          case "${PAYLOAD_ENV}" in
            production|upgrade|release) vercel_env="${PAYLOAD_ENV}" ;;
            *)                          vercel_env="preview" ;;
          esac

          gate_env="${vercel_env}"
          if [ "${vercel_env}" = "preview" ]; then
            case "${PAYLOAD_REF}" in
              staging|refs/heads/staging) gate_env="staging" ;;
            esac
          fi

          csp_eligible="false"
          case "${gate_env}" in
            production|staging|upgrade|release) csp_eligible="true" ;;
          esac

          if [ "${vercel_env}" != "release" ]; then
            case "${PAYLOAD_REF}" in
              release|refs/heads/release|release/*|refs/heads/release/*)
                csp_eligible="false"
                ;;
            esac
          fi

          echo "vercel_env=${vercel_env}" >> "$GITHUB_OUTPUT"
          echo "gate_env=${gate_env}" >> "$GITHUB_OUTPUT"
          echo "csp_eligible=${csp_eligible}" >> "$GITHUB_OUTPUT"
  promote:
    runs-on: ubuntu-latest
    needs: [resolve-context]
    if: ${{ needs.resolve-context.outputs.gate_env == 'production' }}
    environment: production
    steps:
      - name: Cache Vercel CLI
        id: vercel-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/vercel
            /usr/local/bin/vercel
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_VERSION }}
      - name: Install Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install -g vercel@${{ env.VERCEL_VERSION }} --no-audit --no-fund --silent
      - name: Promote to Production
        run: vercel promote $VERCEL_DEPLOYMENT_URL --yes --token=$VERCEL_TOKEN --scope=experius
        env:
          VERCEL_DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  check-vercel-env:
    runs-on: ubuntu-latest
    needs: [resolve-context]
    if: ${{ needs.resolve-context.outputs.csp_eligible == 'true' }}
    outputs:
      set_csp_headers: ${{ steps.check.outputs.set_csp_headers }}
    steps:
      - name: Cache Vercel CLI
        id: vercel-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/vercel
            /usr/local/bin/vercel
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_VERSION }}
      - name: Install Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install -g vercel@${{ env.VERCEL_VERSION }} --no-audit --no-fund --silent
      - name: Check Vercel env flags
        id: check
        run: |
          vercel env pull .env.vercel --yes --environment=${VERCEL_ENV} --token=$VERCEL_TOKEN || vercel env pull .env.vercel --yes --environment=preview --token=$VERCEL_TOKEN
          set -a
          source .env.vercel
          set +a
          missing=()
          [[ -z "${FASTLY_SERVICE_ID:-}" ]] && missing+=("FASTLY_SERVICE_ID")
          [[ -z "${FASTLY_API_KEY:-}" ]]    && missing+=("FASTLY_API_KEY")
          [[ -z "${SANSEC_ID:-}" ]]         && missing+=("SANSEC_ID")
          [[ -z "${CSP_STRICT:-}" ]]        && missing+=("CSP_STRICT")
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "set_csp_headers=true" >> "$GITHUB_OUTPUT"
          else
            echo "set_csp_headers=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CSP header generation; missing or empty: ${missing[*]}"
          fi
        env:
          VERCEL_ENV: ${{ needs.resolve-context.outputs.vercel_env }}
          VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  generate-csp-headers:
    runs-on: ubuntu-latest
    needs: [resolve-context, promote, check-vercel-env]
    if: ${{ always() && needs.check-vercel-env.outputs.set_csp_headers == 'true' && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && contains(fromJson('["staging","upgrade","release"]'), needs.resolve-context.outputs.gate_env))) }}
    steps:
      - name: Cache Vercel CLI
        id: vercel-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/vercel
            /usr/local/bin/vercel
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_VERSION }}
      - name: Install Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install -g vercel@${{ env.VERCEL_VERSION }} --no-audit --no-fund --silent
      - name: Generate CSP Headers
        run: |
          vercel env pull .env.vercel --yes --environment=${VERCEL_ENV} --token=$VERCEL_TOKEN || vercel env pull .env.vercel --yes --environment=preview --token=$VERCEL_TOKEN
          source .env.vercel
          url="https://trigger.happyhorizon.dev/csp_manage_fastly_header?FASTLY_SERVICE_ID=${FASTLY_SERVICE_ID}&FASTLY_API_KEY=${FASTLY_API_KEY}&SANSEC_ID=${SANSEC_ID}&CSP_STRICT=${CSP_STRICT}"
          response=$(curl -sw "%{http_code}" $url)
          status_code="${response:${#response}-3}"
          body=""
          if [ ${#response} -gt 3 ]; then body="${response:0:${#response}-3}"; else body=""; fi
          if [[ "$status_code" -ne 200 ]]; then echo "$body"; pkill LT; fi
        env:
          VERCEL_ENV: ${{ needs.resolve-context.outputs.vercel_env }}
          VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  full-purge-fastly:
    runs-on: ubuntu-latest
    needs: [resolve-context, promote, check-vercel-env, generate-csp-headers]
    if: ${{ always() && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && contains(fromJson('["production","staging","upgrade","release"]'), needs.resolve-context.outputs.gate_env))) }}
    steps:
      - name: Cache Vercel CLI
        id: vercel-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/vercel
            /usr/local/bin/vercel
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_VERSION }}
      - name: Install Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install -g vercel@${{ env.VERCEL_VERSION }} --no-audit --no-fund --silent
      - name: Full Purge Fastly
        run: |
          vercel env pull .env.vercel --yes --environment=${VERCEL_ENV} --token=$VERCEL_TOKEN || vercel env pull .env.vercel --yes --environment=preview --token=$VERCEL_TOKEN
          source .env.vercel
          url="https://trigger.happyhorizon.dev/fastly-flush-cache?FASTLY_SERVICE_ID=${FASTLY_SERVICE_ID}&FASTLY_API_KEY=${FASTLY_API_KEY}"
          response=$(curl -sw "%{http_code}" $url)
          status_code="${response:${#response}-3}"
          body=""
          if [ ${#response} -gt 3 ]; then body="${response:0:${#response}-3}"; else body=""; fi
          if [[ "$status_code" -ne 200 ]]; then echo "$body"; pkill LT; fi
        env:
          VERCEL_ENV: ${{ needs.resolve-context.outputs.vercel_env }}
          VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  newrelic:
    runs-on: ubuntu-latest
    name: New Relic
    needs: [resolve-context, promote]
    if: ${{ needs.resolve-context.outputs.gate_env == 'production' && needs.promote.result == 'success' && vars.NEW_RELIC_DEPLOYMENT_ENTITY_GUID != '' }}
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - name: New Relic Application Deployment Marker
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: "US"
          guid: ${{ vars.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          user: "${{ github.actor }}"
          version: "Vercel Deploy - ${{ steps.date.outputs.date }}"
