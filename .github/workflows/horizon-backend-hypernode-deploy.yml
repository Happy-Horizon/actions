# Reusable Hypernode Magento deploy workflow.
#
# Call from a backend repo:
#
#   jobs:
#     deploy:
#       uses: happy-horizon/actions/.github/workflows/horizon-backend-hypernode-deploy.yml@production
#       with:
#         deploy_stage: staging
#         toolkit_repository: happy-horizon/actions
#       secrets: inherit
#
# For production with a pre-built artifact (latest on Hypernode):
#
#   jobs:
#     deploy:
#       permissions:
#         contents: read
#       uses: happy-horizon/actions/.github/workflows/horizon-backend-hypernode-deploy.yml@production
#       with:
#         deploy_stage: production
#         artifact_name: deployment-build-production
#         toolkit_repository: happy-horizon/actions
#         environment_name: production
#       secrets: inherit
#
# When artifact_name is set, downloads /data/web/builds/<artifact_name>.tgz
# from the stage Hypernode (always the latest overwritten build).
#
# deploy.settings.yml + layering docs: horizon-deploy/README.md

name: Reusable Hypernode Magento deploy

on:
  workflow_call:
    inputs:
      deploy_stage:
        required: true
        type: string
        description: Stage key in deploy.settings.yml (e.g. staging, production, acceptance)
      deploy_image:
        type: string
        default: ""
        description: >
          Docker image for hypernode-deploy. If empty, uses environments.<stage>.deploy_image
          from deploy.settings.yml when set, otherwise deploy_image_fallback.
      deploy_image_fallback:
        type: string
        default: quay.io/hypernode/deploy:4.8.0-php8.4-node22
        description: Used when deploy_image is empty and the stage has no deploy_image in deploy.settings.yml
      toolkit_repository:
        type: string
        description: Repo that contains horizon-deploy/ (leave empty to use only the calling repo)
        default: happy-horizon/actions
      toolkit_ref:
        type: string
        default: production
      toolkit_path_in_repo:
        type: string
        description: Path from repo root to horizon-deploy folder
        default: horizon-deploy
      artifact_name:
        type: string
        default: ""
        description: >
          Basename of a pre-built artifact on the Hypernode (/data/web/builds/<name>.tgz).
          When set, downloads that latest tarball into build/build.tgz before deploying.
          Intended for production promotion flows where build and deploy are separate runs.
      enable_preview_environment:
        type: boolean
        default: false
        description: Enable acceptance/Brancher preview deploys. Keep false to disable preview rollout for a client.
      environment_name:
        type: string
        default: ""
        description: GitHub environment name for deployment protection rules (e.g. production, staging)
      environment_url:
        type: string
        default: ""
        description: GitHub environment URL shown in the deployment status
    outputs:
      deployment_hostname:
        description: Hostname from deployment-report.json (populated for Brancher/acceptance deployments)
        value: ${{ jobs.deploy.outputs.deployment_hostname }}
      deployment_url:
        description: URL from deployment-report.json (populated for Brancher/acceptance deployments)
        value: ${{ jobs.deploy.outputs.deployment_url }}
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      COMPOSER_PROCESS_TIMEOUT:
        required: false
      MAINTENANCE_IP_WHITELIST:
        required: false
      HYPERNODE_API_TOKEN:
        required: false
      GH_TOKEN:
        description: PAT to clone the private toolkit repo (optional). Falls back to GITHUB_TOKEN when unset.
        required: false

jobs:
  deploy:
    outputs:
      deployment_hostname: ${{ steps.report.outputs.hostname }}
      deployment_url: ${{ steps.report.outputs.url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment_name || inputs.deploy_stage }}
      url: ${{ inputs.environment_url }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout deploy toolkit
        if: inputs.toolkit_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit_repository }}
          ref: ${{ inputs.toolkit_ref }}
          path: _horizon_deploy_toolkit
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install deploy.php at project root
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.toolkit_repository }}" ]; then
            SRC="${GITHUB_WORKSPACE}/_horizon_deploy_toolkit/${{ inputs.toolkit_path_in_repo }}/deploy.php"
          else
            SRC="${GITHUB_WORKSPACE}/${{ inputs.toolkit_path_in_repo }}/deploy.php"
          fi
          if [ ! -f "$SRC" ]; then
            echo "deploy.php not found in toolkit at ${SRC}"
            exit 1
          fi
          cp "$SRC" "${GITHUB_WORKSPACE}/deploy.php"
          echo "Installed deploy.php from ${SRC}"

      - name: Download build artifact from Hypernode
        if: inputs.artifact_name != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGE: ${{ inputs.deploy_stage }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          HOST=$(ruby -ryaml -e "d=YAML.load_file('deploy.settings.yml') rescue {}; v=d.dig('environments', ENV['STAGE'], 'servers', 0, 'hostname'); puts(v.nil? || v.to_s.strip.empty? ? '' : v.to_s.strip)")
          if [ -z "$HOST" ]; then
            echo "No hostname found in deploy.settings.yml for environments.${STAGE}.servers[0].hostname"
            exit 1
          fi

          REMOTE_FILE="/data/web/builds/${ARTIFACT_NAME}.tgz"
          LOCAL_PATH="build/build.tgz"

          # Match hypernode-deploy: SSH_PRIVATE_KEY is usually base64-encoded.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/id_rsa"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -qE 'BEGIN (OPENSSH|RSA) PRIVATE KEY'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r\n' | base64 -d > "$KEY_FILE"
          fi
          # OpenSSH requires a trailing newline on the key file.
          [ -n "$(tail -c1 "$KEY_FILE" || true)" ] && printf '\n' >> "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS=(-i "$KEY_FILE" -o IdentitiesOnly=yes)

          mkdir -p build
          echo "Downloading app@${HOST}:${REMOTE_FILE} -> ${LOCAL_PATH}"
          scp "${SSH_OPTS[@]}" "app@${HOST}:${REMOTE_FILE}" "$LOCAL_PATH"
          ls -lh "$LOCAL_PATH"

      - name: Resolve deploy image
        id: resolve_image
        env:
          STAGE: ${{ inputs.deploy_stage }}
        run: |
          set -e
          OVERRIDE="${{ inputs.deploy_image }}"
          FALLBACK="${{ inputs.deploy_image_fallback }}"
          IMG="$OVERRIDE"
          if [ -z "$IMG" ] && [ -f deploy.settings.yml ]; then
            IMG=$(ruby -ryaml -e "d=YAML.load_file('deploy.settings.yml') rescue {}; v=d.dig('environments', ENV['STAGE'], 'deploy_image'); puts(v.nil? || v.to_s.strip.empty? ? '' : v.to_s.strip)")
          fi
          if [ -z "$IMG" ]; then IMG="$FALLBACK"; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Preview rollout disabled
        if: inputs.deploy_stage == 'acceptance' && !inputs.enable_preview_environment
        run: |
          echo "Acceptance preview deploys are disabled for this project."
          echo "Set enable_preview_environment: true in the caller workflow to enable."

      - name: Build
        if: (inputs.deploy_stage != 'acceptance' || inputs.enable_preview_environment) && inputs.artifact_name == ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          COMPOSER_PROCESS_TIMEOUT: ${{ secrets.COMPOSER_PROCESS_TIMEOUT }}
          DEPLOY_CONFIG_STAGE: ${{ inputs.deploy_stage }}
        run: |
          set -e
          # Paths must be container paths: workspace is mounted at /build.
          BOOT="/build/${{ inputs.toolkit_path_in_repo }}/bootstrap.php"
          DEF="/build/${{ inputs.toolkit_path_in_repo }}/defaults/magento2.yml"
          if [ -n "${{ inputs.toolkit_repository }}" ]; then
            BOOT="/build/_horizon_deploy_toolkit/${{ inputs.toolkit_path_in_repo }}/bootstrap.php"
            DEF="/build/_horizon_deploy_toolkit/${{ inputs.toolkit_path_in_repo }}/defaults/magento2.yml"
          fi
          if [ ! -f "${GITHUB_WORKSPACE}${BOOT#/build}" ]; then
            echo "horizon-deploy bootstrap not found at ${BOOT} (host: ${GITHUB_WORKSPACE}${BOOT#/build})"
            exit 1
          fi
          export HORIZON_DEPLOY_BOOTSTRAP="$BOOT"
          export HORIZON_DEPLOY_DEFAULTS="$DEF"
          docker run --rm \
            -e SSH_PRIVATE_KEY \
            -e COMPOSER_PROCESS_TIMEOUT \
            -e DEPLOY_CONFIG_STAGE \
            -e HORIZON_DEPLOY_BOOTSTRAP \
            -e HORIZON_DEPLOY_DEFAULTS \
            -v "${GITHUB_WORKSPACE}:/build" \
            -w /build \
            "${{ steps.resolve_image.outputs.image }}" \
            hypernode-deploy build -vvv

      - name: Deploy
        if: inputs.deploy_stage != 'acceptance' || inputs.enable_preview_environment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          COMPOSER_PROCESS_TIMEOUT: ${{ secrets.COMPOSER_PROCESS_TIMEOUT }}
          MAINTENANCE_IP_WHITELIST: ${{ secrets.MAINTENANCE_IP_WHITELIST }}
          HYPERNODE_API_TOKEN: ${{ secrets.HYPERNODE_API_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_CONFIG_STAGE: ${{ inputs.deploy_stage }}
        run: |
          set -e
          # Paths must be container paths: workspace is mounted at /build.
          BOOT="/build/${{ inputs.toolkit_path_in_repo }}/bootstrap.php"
          DEF="/build/${{ inputs.toolkit_path_in_repo }}/defaults/magento2.yml"
          if [ -n "${{ inputs.toolkit_repository }}" ]; then
            BOOT="/build/_horizon_deploy_toolkit/${{ inputs.toolkit_path_in_repo }}/bootstrap.php"
            DEF="/build/_horizon_deploy_toolkit/${{ inputs.toolkit_path_in_repo }}/defaults/magento2.yml"
          fi
          if [ ! -f "${GITHUB_WORKSPACE}${BOOT#/build}" ]; then
            echo "horizon-deploy bootstrap not found at ${BOOT} (host: ${GITHUB_WORKSPACE}${BOOT#/build})"
            exit 1
          fi
          export HORIZON_DEPLOY_BOOTSTRAP="$BOOT"
          export HORIZON_DEPLOY_DEFAULTS="$DEF"
          docker run --rm \
            -e SSH_PRIVATE_KEY \
            -e COMPOSER_PROCESS_TIMEOUT \
            -e MAINTENANCE_IP_WHITELIST \
            -e HYPERNODE_API_TOKEN \
            -e GITHUB_RUN_ID \
            -e DEPLOY_CONFIG_STAGE \
            -e HORIZON_DEPLOY_BOOTSTRAP \
            -e HORIZON_DEPLOY_DEFAULTS \
            -v "${GITHUB_WORKSPACE}:/build" \
            -w /build \
            "${{ steps.resolve_image.outputs.image }}" \
            hypernode-deploy deploy "${{ inputs.deploy_stage }}" -vvv

      - name: Parse deployment report
        id: report
        if: (inputs.deploy_stage != 'acceptance' || inputs.enable_preview_environment) && always()
        run: |
          if [ -f deployment-report.json ]; then
            HOSTNAME=$(jq -r '.hostnames[0] // empty' deployment-report.json)
            if [ -n "$HOSTNAME" ]; then
              echo "hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
              echo "url=https://$HOSTNAME" >> "$GITHUB_OUTPUT"
            fi
          fi
