name: Vercel Webhook Trigger
run-name: "${{ github.event.client_payload.project.name || github.event.client_payload.project.id || github.event.client_payload.url || 'unknown-project' }} - ${{ github.event.client_payload.git.ref || 'unknown-branch' }} (${{ github.event.client_payload.environment || github.event.client_payload.target || 'unknown-environment' }})"
on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'
jobs:
  vercel:
    if: >-
      ${{
        contains(fromJson('["production","upgrade","release"]'), github.event.client_payload.environment) ||
        contains(fromJson('["production","upgrade","release"]'), github.event.client_payload.target) ||
        contains(fromJson('["refs/heads/production","refs/heads/staging","production","staging"]'), github.event.client_payload.git.ref)
      }}
    uses: happy-horizon/actions/.github/workflows/horizon-storefront-vercel-deployment-success.yml@production
    secrets: inherit
