# Central defaults for Hypernode Deploy (Magento 2). Override or extend from project deploy.settings.yml.
defaults:
  recipe: magento2
  # Deployer CLI binary (php8.4 …/bin/magento) AND desired Hypernode platform PHP.
  # Platform sync is idempotent: hypernode:settings:sync compares live values and
  # only runs hypernode-systemctl --block (maintenance-wrapped) when they drift.
  php_version: "8.4"
  public_folder: pub
  magento_dir: null
  # Extra platform settings (e.g. mysql_version). Same sync + maintenance wrap.
  # php_version from the scalar above is included automatically; listing it here
  # again overrides the scalar for the platform sync only.
  hypernode_settings: []
  variables:
    build:
      static_content_locales: "en_US nl_NL"
      static_content_jobs: 4
      # Projects should override with a locale map, e.g.
      #   HappyHorizon/hyva: "en_US nl_NL"
      #   Magento/backend: "en_US nl_NL"
      # For Hyvä also set hyva_tailwind_dirs + high_performance_static_deploy (4.8+).
      magento_themes:
        - Magento/backend
      composer_process_timeout: 300
      env:
        MAGE_MODE: production
    deploy:
      deploy_path: /data/web/deploy
      keep_releases: 3
      maintenance_ip_whitelist: "${MAINTENANCE_IP_WHITELIST}"
  shared_files:
    - app/etc/env.php
    - pub/.user.ini
  shared_folders:
    - pub/sitemaps
    - var/export
    - var/import_history
    - var/importexport
    - var/log
    - var/report
    - var/session
    - pub/media
  deploy_excludes:
    - ./Capfile
    - ./Gemfile
    - ./Gemfile.lock
    - ./grunt-config.json.sample
    - ./nginx.conf.sample
    - ./package.json.sample
    - ./.htaccess.sample
    - ./Gruntfile.js.sample
    - ./auth.json
    - ./bitbucket-pipelines.yml
    - ./bitbucket-pipelines.yml.sample
    - ./deploy.php.sample
    - ./grumphp.yml
    - ./ruleset.xml
    - ./app/etc/env.dev.php
    - ./config.yml
    - ./ascii
    - ./capistrano
    - ./config
    - ./phpserver
    - ./docker
    - ./dev
    - ./deploy
    - ./var/cache
    - ./var/page_cache
    - ./var/composer_home
    - ./deploy.settings.yml
    - ./deploy.config.json
    - ./horizon-deploy
  build_tasks:
    - deploy:vendors
    - deploy:apcu-autoload
    - magento:compile
    # No-op unless hyva_tailwind_dirs is set (must run before SCD).
    - hyva:tailwind:build
    - magento:deploy:assets
  deploy_tasks:
    - magento:maintenance:enable-if-needed
    - magento:config:import
    - magento:upgrade:db
    - magento:cache:flush
    - magento:cache:enable
    - magento:maintenance:disable
